name: Build MRS Rules

# 触发条件：当你修改了 yaml 文件夹下的任何文件，或者手动点击运行
on:
  push:
    paths:
      - 'yaml/*.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限，以便把 MRS 提交回仓库

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Mihomo
        run: |
          # 下载最新的 Mihomo Linux 内核
          wget -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Compile YAML to MRS
        run: |
          echo "开始转换规则..."
          # 遍历 yaml 文件夹下所有的 .yaml 文件
          for file in yaml/*.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .yaml)
              echo "正在编译: $filename.yaml -> $filename.mrs"
              # 调用 mihomo 内核进行转换，输出到根目录
              mihomo convert-ruleset domain yaml "$file" "$filename.mrs"
            fi
          done

      - name: Commit and Push MRS files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 将生成的 mrs 文件添加到暂存区
          git add *.mrs
          
          # 如果有改动才提交
          if ! git diff --staged --quiet; then
            git commit -m "Auto compile MRS rules [skip ci]"
            git push
          else
            echo "MRS rules are up to date, nothing to commit."
          fi
